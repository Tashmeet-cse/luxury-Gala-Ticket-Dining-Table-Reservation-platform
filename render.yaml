services:
  - type: web
    name: lpu-gala-reservation-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lpu-gala-bookings-db
          property: connectionString
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://tashmeet-cse.github.io

databases:
  - name: lpu-gala-bookings-db
    plan: free
